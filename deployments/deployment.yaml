apiVersion: apps/v1
kind: Deployment

metadata:
  name: company-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: company-app

  template:
    metadata:
      labels:
        app: company-app

    spec:
      containers:
      - name: company-container
        image: nginx:1.25

        ports:
        - containerPort: 80

        securityContext:
          runAsNonRoot: true
          privileged: false
